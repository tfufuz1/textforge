[package]
name = "textforge"
version = "2.1.0"
description = "TextForge v2.1"
authors = ["you"]
edition = "2021"

[[bin]]
name = "textforge"
path = "src/main.rs"

[[bin]]
name = "textforge-cli"
path = "src/bin/textforge-cli.rs"

[build-dependencies]
tauri-build = { version = "2" }

[dependencies]
tauri = { version = "2" }
sqlx = { version = "0.7", features = ["sqlite", "runtime-tokio", "macros"] }
rquickjs = "0.6"
regex = "1"
tokio = { version = "1", features = ["full", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
arboard = "3"
similar = "2"
zip = "2"
base64 = "0.22"
urlencoding = "2"
indexmap = "2"
quick-xml = "0.36"
unicode-normalization = "0.1"
zbus = { version = "4", default-features = false, features = ["tokio"] }

[dev-dependencies]
tempfile = "3"
tauri = { version = "2", features = ["test"] }

